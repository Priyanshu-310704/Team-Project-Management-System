name: MERN DevOps CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Secret Lengths (Secure)
        run: |
          echo "Username length: ${#DOCKER_USER}"
          echo "Password length: ${#DOCKER_PASS}"
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/team-project-backend:v1 ./backend

      - name: Push backend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/team-project-backend:v1

      - name: Build frontend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/team-project-frontend:v1 ./frontend

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/team-project-frontend:v1
